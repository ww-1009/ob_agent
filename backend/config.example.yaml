# 示例配置：复制为 backend/config.yaml 后填入真实值
#   cp backend/config.example.yaml backend/config.yaml
# backend/config.yaml 已被 .gitignore 忽略，不会入库。
# 配置优先级：环境变量（非空） > backend/config.yaml > 代码默认值

ocp:
  provider: real            # mock | real（本地离线演示建议 mock）
  base_url: "http://xxxx:8080"              # real 时填 OCP 4.3.5 网关地址（如 https://<ocp-host>:<port>）
  username: "xxxx"              # 鉴权：HTTP Basic Auth（OCP 管理账号，非 /login 会话）
  password: "xxx"
  verify_ssl: true
sql_ro:
  provider: real            # mock | real
  # 集群名 -> "host:port" 的 dict 字符串；execute_sql / get_table_ddl 按传入的集群名取连接
  host_map: "{'<cluster-name>': '<obproxy-host>:3306', '<cluster-name-2>': '<obproxy-host-2>:3306'}"
  username: "xxxxx"
  password: "xxxx"
  connect_timeout: 5
  query_timeout_seconds: 10
  max_rows: 200
  # ---- 以下一项仅 Oracle 模式租户使用；MySQL 模式忽略 ----
  # Oracle 模式：DSN 的 service name 直接取工具传入的 db_name（即 execute_sql / get_table_ddl 的 db_name），
  #   配置里不再需要 service_name；报 ORA-12514/12505 时说明 db_name 与该租户的 SERVICE_NAME 不一致。
  driver: oracledb          # oracledb（默认：瘦模式，免 Oracle 客户端库）| cx_oracle（需 Python<=3.10 + Instant Client）
llm:
  base_url: "http://xxxxx"   # OpenAI 兼容
  api_key: "xxxxxxxx"
  model: "Qwen3.5-MoE-122B-A10B"
  temperature: 0.7
  max_input_tokens: 250000
agent:
  send_row_data: true       # false 时送入 LLM 的结果不含行数据
  max_seconds: 180          # 单轮 agent 总时长兜底
  confirm_db_ops: true      # 变更类操作是否要人工确认（HITL 审批）
  confirm_timeout_seconds: 120   # 等待人工确认的超时；超时按「拒绝」处理。必须 < max_seconds（否则审批超时不会先触发）
  recursion_limit: 100      # langgraph 单轮图步数上限，防止工具调用打转
memory:
  enabled: false            # true 时启用会话记忆（依赖 PostgreSQL，详见 README「会话记忆」）
  # dsn 非空则优先，可整体覆盖下面的分项连接信息
  dsn: ""
  host: "127.0.0.1"
  port: 5432
  user: "xxxx"
  password: "xxxx"
  dbname: "llm_db"
  pool_min_size: 1
  pool_max_size: 5
  list_limit: 50            # GET /api/threads 默认条数上限
  messages_limit: 500       # GET /api/threads/{id}/messages 默认条数上限
  audit_retention_days: 0   # >0 时启动清理更早的审计行；0 = 永久保留（审计默认只增不删）
  open_timeout_seconds: 5   # 启动时打开连接的等待上限（PG 不可用要尽快降级，别拖住启动）
  open_attempts: 2          # 启动尝试次数；最坏启动阻塞 ≈ open_attempts × open_timeout_seconds + 退避
auth:
  enabled: false            # true 时除 /api/health 外所有 /api 都要求 Bearer 令牌
  token: ""                 # 与 enabled=true 搭配；为空会导致后端拒绝启动（fail closed）
retrieval:
  # 检索后端（Milvus Lite 单引擎：内建 BM25 稀疏 + FLOAT_VECTOR 稠密）。
  # milvus_path 相对路径按 backend/ 解析，不随启动目录漂移。
  milvus_path: "doc/ob_wiki.milvus.db"   # milvus-lite 要求路径以 .db 结尾
  collection: "ob_chunks"
  meta_collection: "ob_meta"
  analyzer: "jieba"            # milvus-lite 3.2.1 的中文分析器类型名必须是 jieba（不是 chinese）
  dense_index_type: "IVF_FLAT"
  nlist: 128
  metric: "COSINE"
  pool_k: 50                   # 每路融合前的候选数
  rrf_k: 60                    # 自研 RRF 平滑常数
  weight_sparse: 1.0
  weight_dense: 1.0
  query_timeout_seconds: 5
  query_cache_size: 512
  max_text_bytes: 8000         # 倒排文本字节上限（Milvus VARCHAR 按字节计）
  version_match_bonus: 8.0     # 取回后、进入 RRF 前的分数调整
  nav_section_penalty: 12.0
  nav_file_penalty: 40.0
  # 默认引擎：sparse | dense | hybrid（M7 起 FTS5 已删除；sparse 是过门禁的那一路）
  # dense / hybrid 每次查询要调一次 embedding API，需要 embedding 配置齐全；没配就填 sparse
  default_retriever: "sparse"
embedding:
  # OpenAI 兼容根地址，要含 /v1：代码请求 {base_url}/embeddings
  base_url: "https://<embedding-host>/v1"
  # ↓↓↓ 在此填入 embedding 模型的 API key ↓↓↓（本地 Ollama/vLLM 可留空，不发 Authorization 头）
  api_key: ""
  model: ""                    # 推荐 BAAI/bge-m3；base_url 与 model 都非空才算「已配置」
  dims: 1024                   # 必须与模型实际输出维度一致，否则启动/建索引会报错
  batch_size: 16               # 单次 /embeddings 请求条数上限。DashScope 兼容模式硬上限 20，故保守默认 16
  concurrency: 4               # 建索引时的并发请求数
  timeout_seconds: 30
  query_cache_size: 512        # 查询向量 LRU 容量；0 = 不缓存
rerank:
  # auto：配置齐全即启用，缺配置静默关闭；off：关闭；api：强制启用（缺配置直接启动失败）
  mode: "auto"
  # jina：{base_url}/rerank（Jina / Cohere 兼容）
  # dashscope：百炼原生 {host}/api/v1/services/rerank/text-rerank/text-rerank
  #   实测阿里云百炼 compatible-mode/v1 下没有 /rerank（404），必须用 dashscope
  protocol: "jina"
  # 兼容形态填到 /v1 根；dashscope 形态会自动从 base_url 反推 host 拼原生路径
  base_url: "https://<rerank-host>/v1"
  # ↓↓↓ 在此填入 reranker 模型的 API key ↓↓↓
  api_key: ""
  model: ""
  top_n: 30                    # 送入 rerank 的候选数
  timeout_seconds: 3.0         # 超时即保留融合原序（不报错）
  max_passage_chars: 500       # 单条 passage 截断上限
